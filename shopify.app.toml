# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# Replace the placeholders below with your new app's values, or run
# `shopify app config link` to have the CLI fill them in from the Partner Dashboard.

client_id = "2bab968b42805a5ad65339e380143fcd"
name = "Gift Threshold"
application_url = "https://gift-app-ux53.onrender.com"
embedded = true

[build]

[webhooks]
api_version = "2026-07"

  # Disabled until protected customer data access is approved in the Partner
  # Dashboard; deploys fail while it's subscribed. Uncomment to record gift history.
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/orders-create"
  # topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app-uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app-subscriptions-update"
  topics = [ "app_subscriptions/update" ]

  # Mandatory GDPR webhooks for public apps
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products   — list gift products and check variant prices
# read_discounts  — check whether a customer's promo code combines with gifts
# write_discounts — create the single-use gift discount codes
# read_orders     — record gift history from orders/create
scopes = "read_products,read_discounts,write_discounts,read_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

# Gift tiers are stored as app-owned metaobjects (type "$app:gift_tier").
# Merchants can view them under Content → Metaobjects; changes go through
# the app's Tiers page so they're validated and the storefront config stays in sync.
[metaobjects.app.gift_tier]
name = "Gift tier"
description = "A cart threshold and the gift budget it unlocks. Managed by the Gift Threshold app."
display_name_field = "label"
access.admin = "merchant_read"
access.storefront = "none"

  [metaobjects.app.gift_tier.fields.label]
  name = "Label"
  type = "single_line_text_field"
  required = true

  [metaobjects.app.gift_tier.fields.min_amount]
  name = "Minimum cart amount (minor units)"
  description = "In the shop currency's minor unit, e.g. 10000 = 100.00"
  type = "number_integer"
  required = true

  [metaobjects.app.gift_tier.fields.gift_percent]
  name = "Gift percent"
  type = "number_decimal"
  required = true

  [metaobjects.app.gift_tier.fields.gift_amount]
  name = "Gift budget (minor units)"
  type = "number_integer"
  required = true

  [metaobjects.app.gift_tier.fields.active]
  name = "Active"
  type = "boolean"
  required = true

[auth]
redirect_urls = [ "https://gift-app-ux53.onrender.com/auth/callback" ]

[pos]
embedded = false

[app_proxy]
url = "https://gift-app-ux53.onrender.com/api"
prefix = "apps"
subpath = "gift-threshold"
