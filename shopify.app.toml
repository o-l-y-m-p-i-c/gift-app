# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# Replace the placeholders below with your new app's values, or run
# `shopify app config link` to have the CLI fill them in from the Partner Dashboard.

client_id = "YOUR_CLIENT_ID"
name = "Gift Threshold"
application_url = "https://YOUR_APP_HOST"
embedded = true

[build]
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders-create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app-uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app-subscriptions-update"
  topics = [ "app_subscriptions/update" ]

  # Mandatory GDPR webhooks for public apps
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_products   — list gift products and check variant prices
# read_discounts  — check whether a customer's promo code combines with gifts
# write_discounts — create the single-use gift discount codes
# read_orders     — record gift history from orders/create
scopes = "read_products,read_discounts,write_discounts,read_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://YOUR_APP_HOST/auth/callback" ]

[pos]
embedded = false

[app_proxy]
url = "https://YOUR_APP_HOST/api"
prefix = "apps"
subpath = "gift-threshold"
