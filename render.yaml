services:
  - type: web
    name: gift-threshold-app
    runtime: node
    # Always-on plan: the free plan sleeps, and Shopify times out app proxy
    # and webhook requests that wait for a cold start.
    plan: starter
    healthCheckPath: /healthz
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      # Pooled connection string, e.g. Neon's "-pooler" host
      - key: DATABASE_URL
        sync: false
      # Direct connection string (same database, host without "-pooler"),
      # used by `prisma migrate deploy` on start
      - key: DIRECT_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SCOPES
        value: read_products,read_discounts,write_discounts,read_orders
      - key: BILLING_PLAN_NAME
        value: Gift App Pro
      - key: BILLING_PLAN_PRICE
        value: "9.99"
      - key: BILLING_PLAN_CURRENCY
        value: USD
      - key: BILLING_TRIAL_DAYS
        value: "14"
      - key: SHOPIFY_BILLING_TEST
        value: "false"
      # Enable with the orders/create webhook once protected customer data is approved
      - key: GIFT_HISTORY_ENABLED
        value: "false"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
