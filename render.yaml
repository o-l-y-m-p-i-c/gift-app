services:
  - type: web
    name: davines-gift-app
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_SHOP_DOMAIN
        value: test-store-size-localization.myshopify.com
      - key: SCOPES
        value: read_products,write_products,read_orders,read_discounts,write_discounts,write_app_proxy
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
