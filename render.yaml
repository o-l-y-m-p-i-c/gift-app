services:
  - type: web
    name: davines-gift-app
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SHOPIFY_API_KEY
        value: 969b879ff2fc49642ac1a83621577c27
      - key: SHOPIFY_API_SECRET
        value: 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
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_products,write_products,read_orders,write_discounts,write_cart_transforms,write_app_proxy
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
